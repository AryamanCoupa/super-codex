[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-codex-harness"
version = "0.5.0"
description = "Local, test-driven Codex orchestration and repeatable cost-quality experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/AryamanCoupa/super-codex"
Documentation = "https://github.com/AryamanCoupa/super-codex/blob/main/docs/INSTALLATION.md"
Issues = "https://github.com/AryamanCoupa/super-codex/issues"

[project.optional-dependencies]
gepa = ["gepa==0.1.4"]
finetune = ["trl==1.17.1", "peft==0.21.0"]

[project.scripts]
supercodex = "codex_harness.cli:main"
sc = "codex_harness.cli:main"
super-codex = "codex_harness.cli:main"
ch = "codex_harness.cli:main"

[tool.setuptools.packages.find]
include = ["codex_harness*"]

[tool.setuptools.package-data]
codex_harness = ["assets/**/*"]
